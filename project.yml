name: M4APlayer
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
targets:
  M4APlayer:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.M4APlayer
        CODE_SIGN_STYLE: Automatic
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Otonotana
        CFBundleShortVersionString: '0.4.6'
        CFBundleVersion: '10'
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    scheme:
      gatherCoverageData: false
      testTargets: [M4APlayerUITests]
  M4APlayerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Checks/UI]
    dependencies:
      - target: M4APlayer
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: M4APlayer
