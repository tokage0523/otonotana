name: Build iPhone app
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Sources/**'
      - 'Checks/main.swift'
      - 'PCEditor/lyrics-core*'
      - 'project.yml'
      - '.github/workflows/build-ios.yml'
permissions:
  contents: read
jobs:
  build:
    # Use the free standard runner only for public repositories.
    if: github.event.repository.private == false
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check lyric formats
        run: |
          node PCEditor/lyrics-core.test.cjs
          swiftc Sources/Lyrics.swift Sources/Track.swift Checks/main.swift -o "$RUNNER_TEMP/check-lyrics"
          "$RUNNER_TEMP/check-lyrics"
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build unsigned iPhone app
        run: >-
          xcodebuild -project M4APlayer.xcodeproj -scheme M4APlayer
          -configuration Release -sdk iphoneos -destination 'generic/platform=iOS'
          -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Package for local signing
        run: |
          mkdir -p package/Payload
          cp -R build/Build/Products/Release-iphoneos/M4APlayer.app package/Payload/
          cd package
          zip -r ../M4APlayer-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: M4APlayer-unsigned
          path: M4APlayer-unsigned.ipa
          retention-days: 3
      - name: Verify player screens on iPhone simulator
        run: |
          xcrun simctl list devices available -j > "$RUNNER_TEMP/devices.json"
          device_id=$(python3 -c 'import json,os; d=json.load(open(os.environ["RUNNER_TEMP"]+"/devices.json")); phones=[v for k,vs in d["devices"].items() if "iOS" in k for v in vs if v["name"].startswith("iPhone")]; preferred=[v for v in phones if v["name"] in ["iPhone 15 Pro","iPhone 16 Pro","iPhone 17 Pro"]]; print((preferred or phones)[0]["udid"])')
          xcodebuild test -project M4APlayer.xcodeproj -scheme M4APlayer -configuration Debug -destination "id=$device_id" -derivedDataPath build -resultBundlePath build/PlayerUI.xcresult CODE_SIGNING_ALLOWED=NO
      - name: Export screen previews
        if: always()
        run: |
          if [ -d build/PlayerUI.xcresult ]; then
            xcrun xcresulttool export attachments --path build/PlayerUI.xcresult --output-path build/screenshots
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-player-preview
          path: build/screenshots
          if-no-files-found: ignore
          retention-days: 3
