<!doctype html><html lang="ja"><meta charset="utf-8"><title>音の棚・再生画面の草案</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#efede9;color:#272b34;font-family:system-ui,'Yu Gothic',sans-serif}main{padding:36px;max-width:1400px;margin:auto}h1{font-size:28px;margin:0 0 10px}p{color:#686970;margin:0 0 26px}section{display:flex;gap:24px;align-items:start}.proposal{width:390px;flex-shrink:0}.label{font-size:17px;font-weight:700;margin:14px 0 7px}.description{font-size:13px;line-height:1.7;color:#626570}.screen{height:800px;border-radius:30px;overflow:hidden;padding:24px;background:linear-gradient(#63504f,#1f181d);color:white;position:relative;box-shadow:0 12px 28px #24242419;display:flex;flex-direction:column}.midnight{background:linear-gradient(#202235,#090c15)}.paper{background:linear-gradient(#faf4e9,#e9e4db);color:#302a26}.status{display:flex;justify-content:space-between;font-size:13px;font-weight:650;margin-bottom:22px}.handle{height:5px;border-radius:5px;width:34px;background:currentColor;opacity:.25;margin:0 auto 17px}.header,.heading,.footer,.transport,.times{display:flex;justify-content:space-between;align-items:center}.header{font-size:13px;opacity:.8;height:40px}.header span:nth-child(2){font-size:12px;letter-spacing:.1em}.art{width:100%;aspect-ratio:1;border-radius:17px;box-shadow:0 15px 30px #0003;margin:20px auto 14px;overflow:hidden}.preview{text-align:center;font-size:13px;opacity:.55;margin:5px 0 30px}.heading h2{font-size:24px;margin:0 0 6px}.artist{font-size:15px;opacity:.6}.heart{font-size:29px}.progress{height:4px;background:#ffffff30;border-radius:4px;margin-top:28px}.progress:before{content:'';display:block;background:currentColor;width:35%;height:4px;border-radius:4px}.paper .progress{background:#302a2625}.times{font-size:11px;opacity:.55;margin-top:8px}.transport{justify-content:center;gap:54px;padding:25px 0}.transport svg{width:29px;height:29px}.transport .play{width:43px;height:43px}.footer{margin-top:auto;height:49px;opacity:.8}.footer svg{height:27px;width:27px}.footer .selected{background:#ffffff22;border-radius:10px;padding:9px;box-sizing:content-box}.paper .footer{color:#804f38}.note{margin-top:28px;font-size:13px}.lyrics{display:none;flex:1;overflow:hidden;margin:8px 0 16px}.pill{display:inline-block;background:#ffffff20;border-radius:30px;padding:10px 12px;font-size:11px;margin:12px 0 15px}.line{font-size:26px;line-height:1.6;font-weight:750;padding:13px 12px;opacity:.45}.line small{display:block;font-size:11px;font-weight:400;margin-top:6px}.line.active{opacity:1;background:#ffffff12;border-radius:12px}.lyric-mode .art,.lyric-mode .preview{display:none}.lyric-mode .lyrics{display:block}.lyric-mode .heading h2{font-size:21px}.lyric-mode .heading{margin-top:0}
svg{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.art svg{width:100%;height:100%;stroke:none}button{border:0;background:none;color:inherit;cursor:pointer;font:inherit}.paper .pill{background:#302a2610}.paper .line.active{background:#302a2610}
</style>
<svg style="display:none"><defs>
<symbol id="quote" viewBox="0 0 28 28"><path d="M6 4h16a3 3 0 0 1 3 3v12a3 3 0 0 1-3 3h-7l-6 4v-4H6a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3Z"/><path d="M9 10h3v4l-3 3m7-7h3v4l-3 3"/></symbol>
<symbol id="airplay" viewBox="0 0 28 28"><path d="m14 17 7 9H7Zm-9 1a12 12 0 1 1 18 0M9 14a7 7 0 1 1 10 0"/></symbol>
<symbol id="queue" viewBox="0 0 28 28"><path d="M8 6h17M8 14h17M8 22h17M3 6h.1M3 14h.1M3 22h.1"/></symbol>
<symbol id="play" viewBox="0 0 28 28"><path d="m7 3 19 11L7 25Z" fill="currentColor" stroke="none"/></symbol>
<symbol id="prev" viewBox="0 0 28 28"><path d="M4 4h4v20H4Zm20 0L8 14l16 10Z" fill="currentColor" stroke="none"/></symbol>
<symbol id="next" viewBox="0 0 28 28"><path d="M20 4h4v20h-4ZM4 4l16 10L4 24Z" fill="currentColor" stroke="none"/></symbol>
<symbol id="cover" viewBox="0 0 400 400"><defs><linearGradient id="g" x2="1" y2="1"><stop stop-color="#e4ad83"/><stop offset=".5" stop-color="#b77485"/><stop offset="1" stop-color="#55577b"/></linearGradient></defs><path fill="url(#g)" d="M0 0h400v400H0z"/><circle cx="286" cy="121" r="125" fill="#edd4b5" opacity=".4"/><circle cx="78" cy="260" r="145" fill="#534463" opacity=".25"/><path d="M-30 305Q100 150 430 255M-20 330Q120 170 440 277" stroke="#fff" stroke-width="1" opacity=".45" fill="none"/><text x="30" y="315" fill="#fff" font-size="43" font-family="Georgia,serif" letter-spacing="4">AFTERGLOW</text><text x="32" y="345" fill="#fff" font-size="11" font-family="sans-serif" letter-spacing="4">A LITTLE LIGHT TO TAKE HOME</text></symbol>
</defs></svg>
<main><h1>音の棚 / 再生画面の草案</h1><p>大きなジャケット、左下の歌詞アイコン、歌詞の自動スクロール切り替え。配色はアプリ内で選べる構成。</p><section id="proposals"></section><div class="note">サンプルのジャケット・曲名・歌詞を使った画面案です。実機の画面とは細部が異なります。</div></main>
<style>.art{background:linear-gradient(135deg,#e4ad83,#b77485 50%,#55577b)}.art svg>use{fill:none}</style>
<script>
const icons=id=>'<svg><use href="#'+id+'"/></svg>';
const names=[['artwork','A · ジャケットに合わせる','ジャケットの色を背景に。落ち着いたグラデーション。'],['midnight','B · ミッドナイト','暗い背景で、ジャケットと歌詞に集中。'],['paper','C · ペーパー','やわらかい明るさ。日中にも読みやすく。']];
document.getElementById('proposals').innerHTML=names.map(([theme,label,description])=>`<div class="proposal"><div class="label">${label}</div><p class="description">${description}</p><div class="screen ${theme}" id="${theme}"><div class="status"><span>14:50</span><span>▂▃▅ ▰</span></div><div class="handle"></div><div class="header"><span>⌄</span><span>再生中</span><span>•••</span></div><div class="art"><svg><use href="#cover"/></svg></div><div class="preview">夜の向こうに、小さな灯り</div><div class="lyrics"><div class="pill">↕ 自動スクロール ON</div><div class="line">ひとつずつ、歩いていこう<small>00:28</small></div><div class="line active">夜の向こうに<br>小さな灯り<small>00:42</small></div><div class="line">この音を、持ち帰ろう<small>00:56</small></div></div><div class="heading"><div><h2>Afterglow</h2><div class="artist">Sample Artist</div></div><span class="heart">♡</span></div><div class="progress"></div><div class="times"><span>1:12</span><span>−2:18</span></div><div class="transport">${icons('prev')}${icons('play').replace('<svg>','<svg class="play">')}${icons('next')}</div><div class="footer"><button class="lyrics-toggle" aria-label="歌詞を表示">${icons('quote')}</button>${icons('airplay')}${icons('queue')}</div></div></div>`).join('');
document.querySelectorAll('.lyrics-toggle').forEach(button=>button.onclick=()=>button.closest('.screen').classList.toggle('lyric-mode'));
</script></html>
